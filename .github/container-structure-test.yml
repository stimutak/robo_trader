schemaVersion: "2.0.0"

fileExistenceTests:
  - name: Application package is present
    path: /app/robo_trader
    shouldExist: true

  - name: Entrypoint is executable
    path: /usr/local/bin/entrypoint.sh
    shouldExist: true
    permissions: "-rwxr-xr-x"

  - name: Only the IBC configuration template is present
    path: /app/config/ibc/config.ini.template
    shouldExist: true

  - name: Populated IBC credentials are absent
    path: /app/config/ibc/config.ini
    shouldExist: false

metadataTest:
  user: trader
  workdir: /app
  entrypoint:
    - /usr/local/bin/entrypoint.sh
  cmd:
    - sh
    - -c
    - "echo 'DISABLED: container trader startup is not yet supported' >&2; exit 2"
  envVars:
    - key: EXECUTION_MODE
      value: paper
    - key: TRADING_MODE
      value: paper
    - key: IBKR_HOST
      value: 127.0.0.1
    - key: IBKR_PORT
      value: "4002"
    - key: IBKR_READONLY
      value: "true"
    - key: PYTHONUNBUFFERED
      value: "1"
