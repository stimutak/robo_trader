name: Docker Build & Test

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'deployment/**'
      - 'requirements*.txt'
      - 'robo_trader/**'
      - 'scripts/**'
      - 'app.py'
      - 'START_TRADER.sh'
      - 'robotrader_favicon.ico'
      - 'config/ibc/config.ini.template'
      - '.github/container-structure-test.yml'
      - '.github/workflows/docker.yml'
  push:
    branches:
      - develop
      - 'feature/**'
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

# R2-CFG-H1.3: minimum permissions at workflow level.
permissions:
  contents: read

jobs:
  docker-build:
    # R2-CFG-H1.3: fork guard.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      ENVIRONMENT: test
      EXECUTION_MODE: paper
      TRADING_MODE: paper
      IBKR_HOST: 127.0.0.1
      IBKR_PORT: "4002"
      IBKR_READONLY: "true"
      IBKR_CLIENT_ID: "123"
      IBKR_ACCOUNT: DU_CI_PAPER
      IBKR_APPROVED_ACCOUNTS: DU_CI_PAPER
      IBKR_ACCOUNT_TYPE: paper
      RT_STATE_NAMESPACE: paper
      RT_DB_PATH: /app/data/ci-paper.db
      MODEL_ARTIFACT_SET: ci-fixtures
      BUILD_ID: github-actions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --tag robotrader:test \
            --load \
            .

      - name: Run Docker security scan
        # TODO(R2-CFG-H1.4): pin to specific commit SHA
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'robotrader:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Test Docker image imports
        run: |
          # Exercise the installed entrypoint with a harmless command. Docker
          # networking is disabled and the database check is skipped, so this
          # validates startup sequencing without broker or service reachability.
          docker run --rm --network none \
            -e EXECUTION_MODE=paper \
            -e TRADING_MODE=paper \
            -e IBKR_HOST=127.0.0.1 \
            -e IBKR_PORT=4002 \
            -e IBKR_READONLY=true \
            -e IBKR_CLIENT_ID=123 \
            -e IBKR_ACCOUNT=DU_CI_PAPER \
            -e IBKR_APPROVED_ACCOUNTS=DU_CI_PAPER \
            -e IBKR_ACCOUNT_TYPE=paper \
            -e RT_STATE_NAMESPACE=paper \
            -e RT_DB_PATH=/app/data/ci-paper.db \
            -e MODEL_ARTIFACT_SET=ci-fixtures \
            -e BUILD_ID=github-actions \
            -e ENVIRONMENT=test \
            -e LOG_LEVEL=DEBUG \
            -e CHECK_DATABASE=false \
            robotrader:test python3 -c \
            "import sys; import robo_trader; from robo_trader.config import load_config; from robo_trader.risk.advanced_risk import AdvancedRiskManager; from robo_trader.monitoring.production_monitor import ProductionMonitor; print('All imports successful'); sys.exit(0)"

      - name: Verify trader command is intentionally inert
        run: |
          set +e
          output="$(docker run --rm --network none \
            -e EXECUTION_MODE=paper \
            -e TRADING_MODE=paper \
            -e IBKR_HOST=127.0.0.1 \
            -e IBKR_PORT=4002 \
            -e IBKR_READONLY=true \
            -e IBKR_CLIENT_ID=123 \
            -e IBKR_ACCOUNT=DU_CI_PAPER \
            -e IBKR_APPROVED_ACCOUNTS=DU_CI_PAPER \
            -e IBKR_ACCOUNT_TYPE=paper \
            -e RT_STATE_NAMESPACE=paper \
            -e RT_DB_PATH=/app/data/ci-paper.db \
            -e MODEL_ARTIFACT_SET=ci-fixtures \
            -e BUILD_ID=github-actions \
            -e ENVIRONMENT=test \
            robotrader:test 2>&1)"
          rc=$?
          set -e

          printf '%s\n' "$output"
          test "$rc" -eq 2
          grep -F "DISABLED: container trader startup is not yet supported" <<<"$output"

      - name: Validate docker compose containment
        env:
          ENVIRONMENT: test
          EXECUTION_MODE: paper
          TRADING_MODE: paper
          IBKR_HOST: 127.0.0.1
          IBKR_PORT: "4002"
          IBKR_READONLY: "true"
          IBKR_CLIENT_ID: "123"
          IBKR_ACCOUNT: DU_CI_PAPER
          IBKR_APPROVED_ACCOUNTS: DU_CI_PAPER
          IBKR_ACCOUNT_TYPE: paper
          RT_STATE_NAMESPACE: paper
          RT_DB_PATH: /app/data/ci-paper.db
          MODEL_ARTIFACT_SET: ci-fixtures
          BUILD_ID: github-actions
          TRADING_SYMBOLS: AAPL
          STRATEGY_ENABLED_STRATEGIES: momentum
          RISK_MAX_POSITION_SIZE: "1000"
          RISK_STOP_LOSS_PERCENT: "0.02"
          RISK_MAX_DAILY_LOSS: "100"
          GRAFANA_PASSWORD: ci-render-only
        run: |
          docker compose --profile unsupported-trader \
            -f docker-compose.yml config --format json \
            > compose-dev.json
          docker compose --profile unsupported-trader \
            -f deployment/docker-compose.prod.yml config --format json \
            > compose-prod.json

          jq -e '
            .services["robo-trader"].environment.EXECUTION_MODE == "paper" and
            .services["robo-trader"].environment.TRADING_MODE == "paper" and
            .services["robo-trader"].environment.IBKR_PORT == "4002" and
            .services["robo-trader"].environment.IBKR_READONLY == "true" and
            (.services["robo-trader"].command | join(" ") |
              contains("container trader startup is not yet supported"))
          ' compose-dev.json

          jq -e '
            .services.trader.environment.EXECUTION_MODE == "paper" and
            .services.trader.environment.TRADING_MODE == "paper" and
            .services.trader.environment.IBKR_PORT == "4002" and
            .services.trader.environment.IBKR_READONLY == "true" and
            (.services.trader.command | join(" ") |
              contains("container trader startup is not yet supported"))
          ' compose-prod.json

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  container-structure-test:
    # R2-CFG-H1.3: fork guard.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image for testing
        run: docker build -t robotrader:test .

      - name: Run container structure tests
        uses: plexsystems/container-structure-test-action@v0.3.0
        with:
          image: robotrader:test
          config: .github/container-structure-test.yml

  docker-compose-render:
    # R2-CFG-H1.3: fork guard.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Render compose topologies without starting services
        env:
          ENVIRONMENT: test
          EXECUTION_MODE: paper
          TRADING_MODE: paper
          IBKR_HOST: 127.0.0.1
          IBKR_PORT: "4002"
          IBKR_READONLY: "true"
          IBKR_CLIENT_ID: "123"
          IBKR_ACCOUNT: DU_CI_PAPER
          IBKR_APPROVED_ACCOUNTS: DU_CI_PAPER
          IBKR_ACCOUNT_TYPE: paper
          RT_STATE_NAMESPACE: paper
          RT_DB_PATH: /app/data/ci-paper.db
          MODEL_ARTIFACT_SET: ci-fixtures
          BUILD_ID: github-actions
          TRADING_SYMBOLS: AAPL
          STRATEGY_ENABLED_STRATEGIES: momentum
          RISK_MAX_POSITION_SIZE: "1000"
          RISK_STOP_LOSS_PERCENT: "0.02"
          RISK_MAX_DAILY_LOSS: "100"
          GRAFANA_PASSWORD: ci-render-only
        run: |
          docker compose \
            --profile unsupported-trader \
            -f docker-compose.yml \
            config --format json > compose-dev.json
          docker compose \
            --profile unsupported-trader \
            -f deployment/docker-compose.prod.yml \
            config --format json > compose-prod.json

          jq -e '
            .services["robo-trader"].environment.EXECUTION_MODE == "paper" and
            .services["robo-trader"].environment.TRADING_MODE == "paper" and
            .services["robo-trader"].environment.IBKR_PORT == "4002" and
            .services["robo-trader"].environment.IBKR_READONLY == "true" and
            (.services["robo-trader"].command | join(" ") |
              contains("container trader startup is not yet supported"))
          ' compose-dev.json

          jq -e '
            .services.trader.environment.EXECUTION_MODE == "paper" and
            .services.trader.environment.TRADING_MODE == "paper" and
            .services.trader.environment.IBKR_PORT == "4002" and
            .services.trader.environment.IBKR_READONLY == "true" and
            (.services.trader.command | join(" ") |
              contains("container trader startup is not yet supported"))
          ' compose-prod.json
