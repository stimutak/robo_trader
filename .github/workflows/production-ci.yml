name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, production ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, production ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly security scan on Mondays

# R2-CFG-H1.x: minimum permissions at workflow level; jobs widen.
permissions:
  contents: read

jobs:
  # Security scanning
  security-scan:
    # Only run on internal PRs (not forks) — scanners receive secret access.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v4
      with:
        # Secret scanning compares explicit commits and therefore needs history.
        fetch-depth: 0

    - name: Run Trivy security scan
      # TODO(R2-CFG-H1.4): pin to specific commit SHA
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Check for hardcoded secrets
      # TODO(R2-CFG-H1.4): pin to specific commit SHA
      uses: trufflesecurity/trufflehog@main
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      with:
        path: ./
        base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  # Comprehensive testing
  test-suite:
    # R2-CFG-H1.x: fork guard — uploads coverage with CODECOV_TOKEN secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EXECUTION_MODE: paper
      TRADING_MODE: paper
      IBKR_HOST: 127.0.0.1
      IBKR_PORT: "4002"
      IBKR_CLIENT_ID: "123"
      IBKR_READONLY: "true"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        test-type: ["unit", "integration", "performance"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r requirements-prod.txt
        pip install -e .

    - name: Prepare .env from template
      run: |
        cp .env.example .env
    
    - name: Run unit tests
      if: matrix.test-type == 'unit'
      # The repo keeps tests flat under tests/ (no tests/unit dir); run the
      # whole suite except the integration subdir, which the integration leg
      # covers separately.
      run: |
        timeout --signal=TERM --kill-after=30s 10m \
          pytest tests/ --ignore=tests/integration -v \
          -o faulthandler_timeout=120 \
          --cov=robo_trader --cov-report=xml --cov-report=html

    - name: Run integration tests
      if: matrix.test-type == 'integration'
      run: |
        timeout --signal=TERM --kill-after=30s 10m \
          pytest tests/integration/ -v \
          -o faulthandler_timeout=120 \
          --cov=robo_trader --cov-append

    - name: Run performance tests
      if: matrix.test-type == 'performance'
      # No performance/benchmark suite exists yet (no tests/performance dir and
      # pytest-benchmark isn't a dependency). Keep the matrix leg green until one
      # is added rather than failing on a missing directory.
      run: |
        echo "No performance benchmark suite configured; skipping."
    
    - name: Upload coverage reports
      if: matrix.test-type == 'unit' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Code quality checks
  code-quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install quality tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy pylint bandit safety
    
    - name: Format check with black
      run: black --check --diff robo_trader/
    
    - name: Import sort check
      run: isort --check-only --diff robo_trader/
    
    - name: Lint with flake8
      run: flake8 robo_trader/ --count --statistics
    
    - name: Type check with mypy
      # This preserves visibility into the existing legacy backlog without
      # pretending that main currently satisfies full strict typing.
      continue-on-error: true
      run: mypy robo_trader/ --ignore-missing-imports

    - name: Collect changed Python files
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PUSH_BASE_SHA: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash scripts/ci/collect_changed_python.sh

    - name: Gate formatting and lint on changed Python files
      run: |
        mapfile -d '' -t changed_python < changed-python.zlist
        if (( ${#changed_python[@]} == 0 )); then
          echo "No changed Python files."
          exit 0
        fi
        black --check -- "${changed_python[@]}"
        isort --check-only --diff -- "${changed_python[@]}"
        flake8 -- "${changed_python[@]}"

    - name: Report type debt in changed application files
      # A strict per-file invocation cannot distinguish pre-existing errors in
      # a touched module from regressions. Keep it visible but advisory until a
      # reviewed base-vs-head mypy baseline exists.
      continue-on-error: true
      run: |
        mapfile -d '' -t changed_python < changed-python.zlist
        changed_application_python=()
        for path in "${changed_python[@]}"; do
          if [[ "$path" == robo_trader/*.py ]]; then
            changed_application_python+=("$path")
          fi
        done
        if (( ${#changed_application_python[@]} == 0 )); then
          echo "No changed application Python files."
          exit 0
        fi
        mypy --ignore-missing-imports --follow-imports=skip \
          -- "${changed_application_python[@]}"
    
    - name: Security check with bandit
      run: bandit -r robo_trader/ -ll
    
    - name: Report dependency vulnerabilities
      # The former command scanned only the quality-tool environment. Scan the
      # base and production runtime requirements and keep this advisory until a
      # reviewed exception baseline allows an actionable blocking supply-chain
      # gate.
      continue-on-error: true
      run: |
        status=0
        for requirements_file in requirements.txt requirements-prod.txt; do
          safety check -r "$requirements_file" --json || status=$?
        done
        exit "$status"

  # Docker build and scan
  docker-build:
    runs-on: ubuntu-latest
    needs: [security-scan, test-suite, code-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write  # for trivy SARIF upload

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image for validation
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        load: true
        push: false
        tags: robotrader:production-ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify imports without starting the trading entrypoint
      run: |
        docker run --rm --entrypoint python3 robotrader:production-ci -c \
          "import robo_trader; from robo_trader.config import load_config; print('container imports ok')"
    
    - name: Scan Docker image
      # TODO(R2-CFG-H1.4): pin to specific commit SHA
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: robotrader:production-ci
        format: 'sarif'
        output: 'docker-scan-results.sarif'
    
    - name: Upload Docker scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'docker-scan-results.sarif'

  # Deploy to staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment:
      name: staging
      url: https://staging.robo-trader.com

    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add actual deployment commands here
        # kubectl apply -f deployment/k8s/staging/
        # or docker-compose -f deployment/docker-compose.staging.yml up -d
    
    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        # Add smoke test commands
        # pytest tests/smoke/ --base-url=https://staging.robo-trader.com

  # Deploy to production (manual approval required)
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # actions/create-release writes a release
    environment:
      name: production
      url: https://robo-trader.com

    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add actual production deployment commands
        # kubectl apply -f deployment/k8s/production/
    
    - name: Run production health checks
      run: |
        echo "Running production health checks..."
        # Add health check commands
        # curl -f https://robo-trader.com/health || exit 1
    
    - name: Create release notes
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
