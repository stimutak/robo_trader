name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# R2-CFG-H1.x: minimum permissions at workflow level; job widens.
permissions:
  contents: read

jobs:
  claude-review:
    # Restrict to PRs from same repo (not forks) to prevent credential exposure
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # v1.0.244: pin the reviewed release instead of the obsolete beta tag.
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Preserve review progress/comments while using the v1 prompt input.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.
            This is a review only. Do not change files, commit, merge, deploy,
            start services, or operate the trading system.

      - name: Require completed review execution
        if: success()
        env:
          REVIEW_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
        run: |
          if [[ "$REVIEW_CONCLUSION" != "success" ]]; then
            echo "::error::The review action did not complete a review. Check for a workflow-validation skip or authentication failure."
            exit 1
          fi
