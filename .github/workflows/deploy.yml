name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# R2-CFG-H1.2: minimum permissions at workflow level.
permissions:
  contents: read

jobs:
  test:
    # R2-CFG-H1.2: fork guard.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EXECUTION_MODE: paper
      TRADING_MODE: paper
      IBKR_HOST: 127.0.0.1
      IBKR_PORT: "4002"
      IBKR_CLIENT_ID: "123"
      IBKR_READONLY: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-prod.txt
          pip install -e .
          
      - name: Run full test suite
        run: |
          timeout --signal=TERM --kill-after=30s 10m \
            python -m pytest tests/ -v -o faulthandler_timeout=120 \
            --tb=short --junitxml=test-results.xml
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy
          
      - name: Check code formatting
        run: |
          black --check robo_trader
          isort --check-only robo_trader
          
      - name: Run flake8
        # Use the tracked .flake8 policy. An inline ignore list had drifted from
        # it and made this job enforce a different project standard.
        run: flake8 robo_trader tests --count --statistics

      - name: Report legacy test import-order debt
        continue-on-error: true
        run: isort --check-only --diff tests

      - name: Collect changed Python files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/ci/collect_changed_python.sh

      - name: Gate changed Python files
        run: |
          mapfile -d '' -t changed_python < changed-python.zlist
          if (( ${#changed_python[@]} == 0 )); then
            echo "No changed Python files."
            exit 0
          fi
          black --check -- "${changed_python[@]}"
          isort --check-only --diff -- "${changed_python[@]}"
          flake8 -- "${changed_python[@]}"
        
      - name: Report legacy type debt
        # Full-package mypy remains visible while the existing backlog is paid
        # down. The Production CI changed-file gate below blocks new type debt.
        continue-on-error: true
        run: mypy robo_trader --ignore-missing-imports

  security:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install safety
        run: |
          python -m pip install --upgrade pip
          pip install safety
          
      - name: Run security scan
        # The inherited gate scanned only the freshly installed `safety`
        # package, not project dependencies. Scan both tracked runtime inputs
        # and report the result until a reviewed vulnerability baseline exists.
        continue-on-error: true
        run: |
          status=0
          for requirements_file in requirements.txt requirements-prod.txt; do
            safety check -r "$requirements_file" --json || status=$?
          done
          exit "$status"
          
      - name: Run Bandit security linter
        run: |
          pip install bandit
          bandit -r robo_trader -ll

  build:
    # Fork guard — this job uploads SARIF with security-events: write.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # for trivy SARIF upload
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image for validation
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: robotrader:deploy-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify imports without starting the trading entrypoint
        run: |
          docker run --rm --entrypoint python3 robotrader:deploy-ci -c \
            "import robo_trader; from robo_trader.config import load_config; print('container imports ok')"
          
      - name: Run Trivy vulnerability scanner
        # TODO(R2-CFG-H1.4): pin to specific commit SHA
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: robotrader:deploy-ci
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment"
          # Add actual deployment commands here
          # Examples:
          # - kubectl apply -f k8s/staging/
          # - helm upgrade --install robo-trader ./charts --namespace staging
          # - aws ecs update-service --cluster staging --service robo-trader
          
      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging"
          # curl https://staging.robo-trader.example.com/health
          
      - name: Notify deployment
        # TODO(R2-CFG-H1.4): pin to specific commit SHA
        uses: 8398a7/action-slack@v3
        if: always() && env.SLACK_WEBHOOK_URL != ''
        with:
          status: ${{ job.status }}
          text: 'Staging deployment ${{ job.status }}'
          
  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # createRelease writes a release
      deployments: write    # createDeployment + createDeploymentStatus
    environment:
      name: production
      url: https://robo-trader.example.com
    steps:
      - uses: actions/checkout@v4
      
      - name: Create deployment
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              required_contexts: [],
              auto_merge: false
            });
            return deployment.data.id;
            
      - name: Deploy to Production
        run: |
          echo "Deploying to production environment"
          # Add actual production deployment commands
          # This should include:
          # - Blue-green deployment
          # - Database migrations
          # - Cache warming
          # - Feature flag updates
          
      - name: Update deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: '${{ job.status }}',
              environment_url: 'https://robo-trader.example.com',
              description: 'Deployment ${{ job.status }}'
            });
            
      - name: Create release notes
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: 'Automated production release',
              draft: false,
              prerelease: false
            });

  rollback:
    if: failure() && github.ref == 'refs/heads/main'
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: Trigger rollback
        run: |
          echo "Initiating rollback procedure"
          # Add rollback commands
          # - Revert to previous Docker image
          # - Restore database backup if needed
          # - Clear caches
          
      - name: Notify rollback
        # TODO(R2-CFG-H1.4): pin to specific commit SHA
        uses: 8398a7/action-slack@v3
        if: env.SLACK_WEBHOOK_URL != ''
        with:
          status: 'warning'
          text: 'Rollback initiated for failed deployment'
