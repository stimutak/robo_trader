name: CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

# R2-CFG-H1.1: minimum permissions at workflow level; jobs only widen as needed.
permissions:
  contents: read

jobs:
  lint:
    # R2-CFG-H1.1: fork guard — never run with secrets on PRs from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 bandit

    - name: Run black
      run: black --check --diff robo_trader/ tests/

    - name: Run isort on application package
      run: isort --check-only --diff robo_trader/

    - name: Report legacy test import-order debt
      continue-on-error: true
      run: isort --check-only --diff tests/

    - name: Run flake8
      run: flake8 robo_trader/ tests/ --count --statistics

    - name: Collect changed Python files
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PUSH_BASE_SHA: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash scripts/ci/collect_changed_python.sh

    - name: Gate changed Python files
      run: |
        mapfile -d '' -t changed_python < changed-python.zlist
        if (( ${#changed_python[@]} == 0 )); then
          echo "No changed Python files."
          exit 0
        fi
        black --check -- "${changed_python[@]}"
        isort --check-only --diff -- "${changed_python[@]}"
        flake8 -- "${changed_python[@]}"

    - name: Run bandit security scan
      run: bandit -r robo_trader/ -ll --skip B101,B104,B201

  test:
    # R2-CFG-H1.1: fork guard — codecov upload uses CODECOV_TOKEN secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXECUTION_MODE: paper
      TRADING_MODE: paper
      IBKR_HOST: 127.0.0.1
      IBKR_PORT: "4002"
      IBKR_CLIENT_ID: "123"
      IBKR_READONLY: "true"
      ENVIRONMENT: dev
    strategy:
      fail-fast: false
      matrix:
        # 3.13 excluded: pydantic 2.6.x / pydantic-core won't build on 3.13
        # (ForwardRef._evaluate signature change) and the pinned tensorflow has
        # no 3.13 wheel. Production runs 3.12. Re-add once pydantic is >=2.9.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Prepare .env from template
      run: |
        cp .env.example .env

    - name: Run all tests
      run: |
        pytest tests/ -v --cov=robo_trader --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
