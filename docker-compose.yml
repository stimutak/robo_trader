version: '3.8'

services:
  # WebSocket server for real-time updates
  websocket:
    build: .
    container_name: robo_trader_websocket
    command: python3 -m robo_trader.websocket_server
    ports:
      - "8765:8765"
    environment:
      - WEBSOCKET_PORT=8765
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - robo_trader_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import asyncio, websockets; asyncio.run(websockets.connect('ws://localhost:8765'))"]
      interval: 30s
      timeout: 10s
      retries: 3
    # C-7 (followup audit): cap resources to prevent a runaway service from
    # starving the host. Mirrors the limits structure used by `robo-trader`.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Dashboard web application
  dashboard:
    build: .
    container_name: robo_trader_dashboard
    command: python3 app.py
    ports:
      - "5555:5555"
    environment:
      # The dashboard imports the same fail-closed runtime contract as the
      # runner. Identity-bearing values must come from the operator; Compose
      # must never invent an account or ledger.
      - ENVIRONMENT=${ENVIRONMENT:?Set ENVIRONMENT for the dashboard}
      - EXECUTION_MODE=paper
      - TRADING_MODE=paper
      - IBKR_HOST=${IBKR_HOST:?Set IBKR_HOST for the supervised paper Gateway}
      - IBKR_PORT=4002
      - IBKR_READONLY=true
      - IBKR_CLIENT_ID=${IBKR_CLIENT_ID:?Set a dedicated dashboard IBKR_CLIENT_ID}
      - IBKR_ACCOUNT=${IBKR_ACCOUNT:?Set the expected paper IBKR_ACCOUNT}
      - IBKR_APPROVED_ACCOUNTS=${IBKR_APPROVED_ACCOUNTS:?Allowlist the paper IBKR_ACCOUNT}
      - IBKR_ACCOUNT_TYPE=paper
      - RT_STATE_NAMESPACE=${RT_STATE_NAMESPACE:?Set RT_STATE_NAMESPACE to paper}
      - RT_DB_PATH=${RT_DB_PATH:?Set the container paper ledger path}
      - SAFETY_ACCOUNT_SCOPE_KEY=${SAFETY_ACCOUNT_SCOPE_KEY:?Set the secret paper account-scope key}
      - SAFETY_ACCOUNT_SCOPE=${SAFETY_ACCOUNT_SCOPE:?Set an opaque paper safety account scope}
      - SAFETY_JOURNAL_PATH=${SAFETY_JOURNAL_PATH:?Set the dedicated paper safety journal path}
      - MODEL_ARTIFACT_SET=${MODEL_ARTIFACT_SET:?Identify the paper model artifact set}
      - BUILD_ID=${BUILD_ID:?Identify the rendered build}
      - DASH_PORT=5555
      - WEBSOCKET_URL=ws://websocket:8765
      - LOG_LEVEL=INFO
      - LOG_CONSOLE=true
      - MONITORING_LOG_FORMAT=plain
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - websocket
    networks:
      - robo_trader_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # C-7 (followup audit): cap resources for the Flask dashboard.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Main trading runner
  robo-trader:
    build: .
    container_name: robo_trader_main
    profiles: ["unsupported-trader"]
    command: ["sh", "-c", "echo 'DISABLED: container trader startup is not yet supported' >&2; exit 2"]
    environment:
      - EXECUTION_MODE=paper
      - TRADING_MODE=paper
      - IBKR_READONLY=true
      - IBKR_HOST=${IBKR_HOST:-127.0.0.1}
      - IBKR_PORT=${IBKR_PORT:-4002}
      - IBKR_CLIENT_ID=${IBKR_CLIENT_ID:-1}
      - SAFETY_ACCOUNT_SCOPE_KEY=${SAFETY_ACCOUNT_SCOPE_KEY:?Set the secret paper account-scope key}
      - SAFETY_ACCOUNT_SCOPE=${SAFETY_ACCOUNT_SCOPE:?Set an opaque paper safety account scope}
      - SAFETY_JOURNAL_PATH=${SAFETY_JOURNAL_PATH:?Set the dedicated paper safety journal path}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WEBSOCKET_URL=ws://websocket:8765
      - STRATEGY_ENABLED_STRATEGIES=${STRATEGY_ENABLED_STRATEGIES:-baseline_sma}
      - RISK_MAX_POSITION_SIZE=${RISK_MAX_POSITION_SIZE:-10000}
      - RISK_STOP_LOSS_PERCENT=${RISK_STOP_LOSS_PERCENT:-0.02}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    depends_on:
      - websocket
      - dashboard
    networks:
      - robo_trader_network
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Redis for caching and session management (optional)
  redis:
    # TODO(C-8): pin to sha256 digest (e.g. redis:7-alpine@sha256:<digest>).
    # Floating tags allow upstream to silently replace the image. Operator
    # should run `docker pull redis:7-alpine && docker images --digests` and
    # copy the digest here.
    image: redis:7-alpine
    container_name: robo_trader_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - robo_trader_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    # C-7 (followup audit): cap redis resources too.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  robo_trader_network:
    driver: bridge

volumes:
  redis_data:
